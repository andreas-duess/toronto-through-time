<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toronto Through Time</title>
    <meta name="description" content="Watch Toronto grow from 1793 to today on a 3D map: every building in the old city by its year, the moving shoreline, the railways, the forest and the buildings that are gone." />
    <link rel="canonical" href="https://toronto.duess.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toronto.duess.com/" />
    <meta property="og:title" content="Toronto Through Time" />
    <meta property="og:description" content="Watch Toronto grow from 1793 to today on a 3D map. An early version: corrections welcome." />
    <meta property="og:image" content="https://toronto.duess.com/card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@AndreasDuess" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="population">
      <div class="label">Population</div>
      <div id="population-value">—</div>
      <div class="sublabel">old City of Toronto</div>
      <div id="standing" class="sublabel"></div>
    </div>

    <div id="year-label">1793</div>

    <div id="story" hidden>
      <button id="story-close" aria-label="Close story">✕</button>
      <div id="story-count"></div>
      <h2 id="story-title"></h2>
      <p id="story-text"></p>
      <div id="story-progress"><div></div></div>
      <div id="story-nav">
        <button id="story-prev" aria-label="Previous">⏮</button>
        <button id="story-play" aria-label="Pause story">❚❚</button>
        <button id="story-next" aria-label="Next">⏭</button>
        <a id="story-source" target="_blank" rel="noopener">source</a>
      </div>
    </div>

    <div id="sun" hidden title="The sun over Toronto today, at this time of day">
      <span aria-hidden="true">☀</span>
      <input id="sun-slider" type="range" step="5" aria-label="Time of day" />
      <output id="sun-time"></output>
      <button id="sun-now" hidden>now</button>
    </div>

    <div id="rotate-hint" hidden></div>
    <div id="legend" hidden></div>
    <div id="shoreline-note" hidden></div>

    <footer id="controls">
      <button id="play" aria-label="Play">▶</button>
      <button id="story-toggle" aria-pressed="false">Story</button>
      <div id="slider-wrap">
        <div id="event-ticks"></div>
        <input id="slider" type="range" step="0.01" aria-label="Year" />
      </div>
      <select id="speed" aria-label="Playback speed">
        <option value="1">1 yr/s</option>
        <option value="3">3 yr/s</option>
        <option value="6" selected>6 yr/s</option>
        <option value="12">12 yr/s</option>
        <option value="25">25 yr/s</option>
      </select>
      <button id="quality" aria-pressed="false" title="Colour each building by where its year comes from">Data quality</button>
      <a id="sources-link" href="./sources.html" target="_blank" rel="noopener">sources</a>
      <a id="comments-link" href="https://x.com/AndreasDuess" target="_blank" rel="noopener" title="An early version. Tell Andreas what is wrong or missing.">comments?</a>
    </footer>

    <div id="info" hidden></div>
    <div id="loading">Loading Toronto…</div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
